# Anamika service stack: API (stateless, scalable) + pipeline workers + Redis.
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
#   docker compose up -d --scale worker=3     # more parallel jobs
# The frontend (Next.js) will be added as a separate service in the frontend stage.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-backend-env: &backend-env
  ANAMIKA_ENV: ${ANAMIKA_ENV:-production}
  ANAMIKA_MASTER_SECRET: ${ANAMIKA_MASTER_SECRET:?set ANAMIKA_MASTER_SECRET in .env}
  ANAMIKA_API_KEYS_SHA256: ${ANAMIKA_API_KEYS_SHA256:?set ANAMIKA_API_KEYS_SHA256 in .env}
  ANAMIKA_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  ANAMIKA_QUEUE_MODE: redis
  ANAMIKA_DATASETS_DIR: /datasets
  ANAMIKA_CORS_ORIGINS: ${ANAMIKA_CORS_ORIGINS:-http://localhost:3000}
  ANAMIKA_TRUSTED_HOSTS: ${ANAMIKA_TRUSTED_HOSTS:-localhost,127.0.0.1,api}
  ANAMIKA_RATE_DEFAULT: ${ANAMIKA_RATE_DEFAULT:-120/minute}
  ANAMIKA_RATE_JOBS_CREATE: ${ANAMIKA_RATE_JOBS_CREATE:-10/minute}
  ANAMIKA_RATE_DOWNLOADS: ${ANAMIKA_RATE_DOWNLOADS:-300/minute}
  ANAMIKA_JOB_TTL_HOURS: ${ANAMIKA_JOB_TTL_HOURS:-24}
  # Demo only: serve originals of server-side synthetic datasets for side-by-side views.
  # Refused at start-up when ANAMIKA_ENV=production.
  ANAMIKA_ALLOW_ORIGINALS: ${ANAMIKA_ALLOW_ORIGINALS:-false}

services:
  redis:
    image: redis:7.4-alpine
    <<: *hardening
    user: "999:1000"   # run as the image's redis user directly (no setuid needed with cap_drop ALL)
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --save "" --appendonly no
      --maxmemory 256mb --maxmemory-policy noeviction --protected-mode yes
      --rename-command FLUSHALL "" --rename-command CONFIG "" --rename-command DEBUG ""
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 320m }

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: anamika-backend:local
    <<: *hardening
    environment: *backend-env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    networks: [edge, backend]
    volumes:
      - jobs:/data
      - ${DATASETS_HOST_DIR:-./datasets}:/datasets:ro
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768m }

  worker:
    image: anamika-backend:local
    <<: *hardening
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      <<: *backend-env
      ANAMIKA_INLINE_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      ANAMIKA_JOB_CPUS: "2"
      ANAMIKA_JOB_MEMORY_MB: "4096"
    # The worker sits ONLY on the internal network: no internet egress, matching the
    # offline guarantee of the pipeline.
    networks: [backend]
    volumes:
      - jobs:/data
      - ${DATASETS_HOST_DIR:-./datasets}:/datasets:ro
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4608m }

networks:
  edge: {}
  backend:
    internal: true

volumes:
  jobs: {}
